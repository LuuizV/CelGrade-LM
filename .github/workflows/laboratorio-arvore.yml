name: Laboratorio da Arvore - Windows
on:
  push:
    branches:
      - experimental/arvore-busca
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:lab
      - uses: actions/upload-artifact@v4
        with:
          name: CelGrade-LM-Laboratorio-Arvore
          path: lab-output/CelGrade-LM-Laboratorio-Arvore-*.exe
          retention-days: 14
          if-no-files-found: error
